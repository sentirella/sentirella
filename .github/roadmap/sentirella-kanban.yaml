  note: Structured manifest for the Sentirella integrated roadmap (Open Source & Self-Hosting / Product / Shared / Current Prototype). Single source of truth read by .github/roadmap/sync-project.mjs. Roadmap content is rendered deterministically from this manifest.
  repo_owner: sentirella
  repo_name: sentirella
  project_owner: sentirella
  project_number: 2
  project_kind: user
  project_name: Sentirella — Integrated Roadmap
  project_description: 'Complete planning for Sentirella: current prototype status, transition to an open and self-hostable infrastructure, product evolution, Open Source milestones, security, connectivity, documentation, and publication.'
  project_url: https://github.com/users/sentirella/projects/2
  repo_url: https://github.com/sentirella/sentirella
  branch: main
  language: English (all visible GitHub content)
  total_epics: 16
  total_issues: 138
  total_items: 154
  next_task_id: T139
  next_epic_id: E17
  chronological_numbering_policy: >-
    Public roadmap identifiers are assigned chronologically when work is
    formally accepted into the roadmap. Task identifiers are never reused,
    even when a task is cancelled, merged, or removed from active planning.
    Existing identifiers are never renumbered merely because priorities or
    implementation dates change.
fields:
  status_field:
    name: Status
    action: reuse_and_redefine_options
    note: Reuse GitHub's existing Status field (not renamed). Board is empty, so its options are fully redefined in this exact order.
    options:
      - Needs definition
      - Backlog
      - Ready
      - In progress
      - Blocked
      - In review
      - Done
    meaning:
      Needs definition: A technical or product decision is required before implementation can start.
      Backlog: Accepted work that is not yet prepared to start.
      Ready: Scope and acceptance criteria are complete and work may start.
      In progress: Active implementation or evidence-based validation is taking place.
      Blocked: Work cannot continue because of a specific hard dependency.
      In review: Implementation is complete and is awaiting verification.
      Done: All acceptance criteria are met and completion evidence is attached or, for historical prototype records, explicitly marked as pending historical evidence.
  reuse:
    - name: Parent issue
      action: none_already_active
      note: Already active by default in Projects v2. Nothing to create.
    - name: Sub-issue progress
      action: none_already_active
      note: Already active by default in Projects v2. Nothing to create.
    - name: Estimate
      rename_to: Estimated effort
      action: rename
      data_type: number
      note: Existing built-in number field, renamed for the "Estimated effort" requirement.
    - name: Start date
      action: reuse_as_is
      note: Existing built-in date field, used as-is.
    - name: Target date
      action: reuse_as_is
      note: Existing built-in date field, used as-is.
  not_used:
    - name: Priority
      note: GitHub's built-in P0/P1/P2 field. Kept unchanged and unused because the roadmap uses the separate Priority level field. Not displayed in any documented view. Not renamed or repurposed.
    - name: Size
      note: Left untouched and unused.
    - name: Title
      note: Standard, unchanged.
    - name: Assignees
      note: Standard, unchanged. This project never uses assignee, owner, responsibility or person fields.
    - name: Labels
      note: Standard, unchanged.
    - name: Linked pull requests
      note: Standard, unchanged.
    - name: Milestone
      note: Standard, unchanged.
    - name: Repository
      note: Standard, unchanged.
    - name: Reviewers
      note: Standard, unchanged.
    - name: Created
      note: Standard, unchanged.
    - name: Updated
      note: Standard, unchanged.
    - name: Closed
      note: Standard, unchanged.

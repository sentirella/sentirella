      ## Context

      This Epic groups the approved work required to achieve the objective below. It remains open until every required child Issue and every Epic-level acceptance criterion is complete.

      ## Objective

      Allow Sentirella to operate without Google and let each installation choose how accounts are created, verified and recovered.

      ## Scope

      This Epic is limited to its listed direct child Issues and Epic-level acceptance criteria.

      ## Out of scope

      Any change that is not explicitly required by this item's Objective, Planned work, or Acceptance criteria.

      ## Planned work

      - [ ] `H2-01` — Define the account creation and recovery matrix
      - [ ] `H2-02` — Separate the stable account identifier from the display name
      - [ ] `H2-03` — Support accounts without email addresses
      - [ ] `H2-04` — Support email accounts without verification
      - [ ] `H2-05` — Support configurable email verification
      - [ ] `H2-06` — Decouple the core from Google OAuth
      - [ ] `H2-07` — Provide secure password recovery and recovery user experience
      - [ ] `H2-08` — Define recovery for accounts without email
      - [ ] `H2-09` — Migrate existing accounts to the configurable identity model
      - [ ] `H2-10` — Verify two-factor authentication across account modes

      ## Acceptance criteria


      ## Context

      The current Sentirella prototype does not yet satisfy the result described in this Issue. This work belongs to the parent Epic listed in the roadmap manifest.

      ## Objective

      Allow a client to select a compatible relay automatically when direct connectivity fails and no specific private relay is required.

      ## Scope

      This Issue is limited to the objective and the deliverables explicitly listed under Planned work.

      ## Out of scope

      Any change that is not explicitly required by this item's Objective, Planned work, or Acceptance criteria.

      ## Planned work

      - [ ] Query the configured relay pool or directory.
      - [ ] Filter incompatible or unhealthy relays.
      - [ ] Consider capacity and saturation information.
      - [ ] Consider latency when available without exposing sensitive location data.
      - [ ] Respect installation and user policy.
      - [ ] Retry selection after relay failure within documented limits.
      - [ ] Record selection diagnostics without payload contents.

      ## Acceptance criteria

      - [ ] The client ignores unhealthy and incompatible relays.
      - [ ] A compatible available relay can be selected without manual user choice.
      - [ ] A configured private relay policy is respected.
      - [ ] Selection retry does not loop without bound.
      - [ ] The selection process does not expose file contents.

      ## Dependencies

      - `H5-06` — Design a relay pool and directory
      - `H5-05` — Create a self-hostable relay package


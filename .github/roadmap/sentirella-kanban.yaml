      **Roadmap ID:** `T135`  
      **Internal key:** `PR8-03`

      ## Context

      The current Sentirella prototype does not yet satisfy the result described in this Issue. This work belongs to the parent Epic listed in the roadmap manifest.

      ## Objective

      Perform or commission an independent review of account creation, authentication, session handling, folder permissions, roles, invitations and revocation.

      ## Scope

      This Issue is limited to the objective and the deliverables explicitly listed under Planned work.

      ## Out of scope

      Any change that is not explicitly required by this item's Objective, Planned work, or Acceptance criteria.

      ## Planned work

      - [ ] Review registration modes.
      - [ ] Review password and recovery flows.
      - [ ] Review two-factor authentication.
      - [ ] Review session creation and invalidation.
      - [ ] Review folder roles and permission checks.
      - [ ] Review invitations, expiry and reuse.
      - [ ] Review participant and device revocation.
      - [ ] Record findings in the approved audit format.
      - [ ] Avoid public disclosure of uncorrected exploitable details.

      ## Acceptance criteria

      - [ ] Every in-scope identity and authorisation flow is reviewed.
      - [ ] Findings include severity, evidence and affected component.
      - [ ] False positives and accepted risks are distinguished.
      - [ ] High-risk unresolved details are handled privately.
      - [ ] Findings are linked to remediation Issues.

      ## Dependencies

      - `PR8-01` — Define the scope of the external security audit
      - `PR8-02` — Prepare architecture, threat-model and test material for audit
      - `H2-09` — Migrate existing accounts to the configurable identity model
      - `H2-10` — Verify two-factor authentication across account modes
      - `H6-07` — Manage participant addition and revocation
      - `H6-08` — Manage lost, replaced and revoked devices

      ## Related work

      None.

      ## Tests

      Verify every acceptance criterion and every test scenario explicitly listed under Planned work. Add automated regression coverage where the repository already contains an applicable test layer. When automated coverage is not applicable, document the manual verification procedure, environment, and result.

      ## Documentation

      Update only the user, administrator, deployment, API, security, or developer documentation directly affected by this Issue. Do not create unrelated documentation.

      ## Completion evidence

      Before closing this Issue, link the implementing Pull Request or commit, relevant test results, and every updated document. Add deployment or runtime evidence when required by the acceptance criteria.

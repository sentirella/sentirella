views:
  - 'n': 1
    name: General Kanban
    layout: Board
    group_by: Status
    filter: None
    show:
      - Priority level
      - Roadmap
      - Area
      - Open Source milestone
  - 'n': 2
    name: Open Source & Self-Hosting
    layout: Board
    group_by: Status
    filter: Roadmap = "Open Source & Self-Hosting" OR Roadmap = "Shared"
  - 'n': 3
    name: Product
    layout: Board
    group_by: Status
    filter: Roadmap = "Product" OR Roadmap = "Shared"
  - 'n': 4
    name: Current Prototype
    layout: Table
    group_by: None
    filter: Phase = "Existing Prototype"
    show:
      - Status
      - label:current-dependency
      - label:requires-adaptation
      - related future work (Related work section)
      - Evidence
  - 'n': 5
    name: Open Source Scope
    layout: Board
    group_by: Open Source milestone
    sort_by:
      - Status
      - Priority level
    filter: Phase = "Open Source Scope"
  - 'n': 6
    name: Decisions & Research
    layout: Board
    group_by: Status
    filter: Type = "Decision" OR Type = "Research"
  - 'n': 7
    name: Blocked
    layout: Table
    group_by: None
    filter: Status = "Blocked"
    show:
      - native blocking dependencies (Blocked by, sidebar)
  - 'n': 8
    name: Security
    layout: Board
    group_by: Status
    filter: Area = "Cryptography" OR Area = "Security" OR label:security-critical
  - 'n': 9
    name: Active Work
    layout: Board
    group_by: Status
    filter: Status = "In progress" OR Status = "In review"
  - 'n': 10
    name: Timeline Roadmap
    layout: Roadmap
    group_by: None
    filter: None
    note: Use only after explicit dates exist. Left unconfigured until real Start date / Target date values are approved -- no date is invented now.
duplicate_avoidance_rule: 'When a task is needed by both the Product and Open Source roadmaps, a single Issue is created with Roadmap: Shared, its two related Epics noted under Related work, and only its documented hard dependencies. No task is duplicated across roadmaps.'
relationship_rules:
  - Every non-Epic Issue has exactly the Parent Epic shown in the catalogue.
  - The three merged Shared Issues remain children of their Open Source Epic and are listed as Related work from the corresponding Product Epic.
  - A native blocked-by relationship is created only for entries under Hard dependencies.
  - Related work never becomes a native dependency.
  - No transitive dependencies are added automatically.
  - Status Backlog or Ready may coexist with a native dependency. Blocked is used only where the catalogue explicitly assigns Blocked.
  - No dependency is derived from similar wording, shared Areas, shared Epics, or implementation intuition.

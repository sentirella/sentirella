      <!-- sentirella-roadmap-key: EPIC-P0 -->
      **Roadmap ID:** `E01`  
      **Internal key:** `EPIC-P0`

      ## Context

      This Epic groups the approved work required to achieve the objective below. This Epic records already implemented prototype capabilities. It is marked Done, while linked provider-neutral adaptations remain separate future Issues.

      ## Objective

      Record the capabilities already implemented in the current Sentirella prototype without presenting their future provider-neutral adaptations as complete.

      ## Scope

      This Epic is limited to its listed direct child Issues and Epic-level acceptance criteria.

      ## Out of scope

      Any change that is not explicitly required by this item's Objective, Planned work, or Acceptance criteria.

      ## Planned work

      - [ ] `P0-01` — Local gatekeeper and coordination server architecture
      - [ ] `P0-02` — Production deployment of the coordination server
      - [ ] `P0-03` — Automatic connection monitoring and recovery
      - [ ] `P0-04` — Username and password authentication
      - [ ] `P0-05` — Registration with email verification
      - [ ] `P0-06` — Google OAuth sign-in
      - [ ] `P0-07` — Optional two-factor authentication
      - [ ] `P0-08` — Basic user profile with name and picture
      - [ ] `P0-09` — Create and share folders
      - [ ] `P0-10` — Invite and remove folder participants
      - [ ] `P0-11` — Owner, administrator and user folder roles
      - [ ] `P0-12` — Pause access to a shared folder
      - [ ] `P0-13` — Leave a shared folder
      - [ ] `P0-14` — Remote deletion protection
      - [ ] `P0-15` — Per-folder connected and disconnected state
      - [ ] `P0-16` — Per-folder last connection timestamp
      - [ ] `P0-17` — Real-time synchronisation across open sessions
      - [ ] `P0-18` — File and folder search
      - [ ] `P0-19` — Download a complete folder as ZIP
      - [ ] `P0-20` — Spanish and English interface
      - [ ] `P0-21` — Windows context-menu integration
      - [ ] `P0-22` — Prevent sleep while sharing
      - [ ] `P0-23` — Continue running in the system tray
      - [ ] `P0-24` — Light, dark and system themes
      - [ ] `P0-25` — Final visual identity, logo and typography
      - [ ] `P0-26` — Initial automatic update system
      - [ ] `P0-27` — General interface refinements and empty states
      - [ ] `P0-28` — Public Sentirella landing page
      - [ ] `P0-29` — User wiki
      - [ ] `P0-30` — Initial API documentation
      - [ ] `P0-31` — Repository published under AGPL

      ## Acceptance criteria

      - [ ] All 31 prototype capability Issues exist and are marked Done.
      - [ ] Each capability is confirmed by code, deployment, documentation or explicitly pending historical evidence.
      - [ ] Provider-dependent capabilities are marked and linked to future adaptation work.
      - [ ] The epic distinguishes implemented prototype behaviour from future Open Source and product work.

      ## Dependencies

      None.

      ## Related work

      None.

      ## Tests

      Reference existing functional evidence where available. If historical evidence is not currently attached, record that fact explicitly without inventing a test result.

      ## Documentation

      Update only the user, administrator, deployment, API, security, or developer documentation directly affected by this Issue. Do not create unrelated documentation.

      ## Completion evidence

      Link existing code, deployment, documentation, screenshots, or test evidence. If historical evidence is not yet available, mark it explicitly as pending historical evidence instead of inventing it.
